<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>CivicFix AI v4 · Smart Campus Complaint Triage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
:root{
  --bg:#f3f6fc;--bg2:#e9eef9;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
  --brand:#4f46e5;--brand2:#06b6d4;--shadow:0 10px 40px rgba(15,23,42,.08);
  --high:#e11d48;--med:#f59e0b;--low:#10b981;--chip:#eef2ff;
}
:root[data-theme="dark"]{
  --bg:#0b1020;--bg2:#10172d;--card:#141b34;--ink:#e8ecf8;--mute:#94a3b8;--line:#243052;
  --shadow:0 10px 40px rgba(0,0,0,.45);--chip:#1b2547;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 500px at 85% -10%,rgba(79,70,229,.18),transparent 60%),
             radial-gradient(900px 500px at -10% 0%,rgba(6,182,212,.15),transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-style:normal;font-size:22px;box-shadow:0 8px 24px rgba(79,70,229,.4)}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:13px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--brand);font-weight:600;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:17px}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);width:max-content;max-width:100%;overflow:auto;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--mute);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
textarea{width:100%;min-height:120px;resize:vertical;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:.15s}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 22px rgba(79,70,229,.35);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--brand)}
.count{color:var(--mute);font-size:12px}
.hide{display:none!important}
.status{color:var(--mute);min-height:20px;margin-top:8px}
.err{color:var(--high);font-weight:600}
/* result */
.res-top{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.gauge{position:relative;width:180px;height:180px;margin:auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .num{font-size:40px;font-weight:800;line-height:1}
.gauge .lbl{font-size:12px;color:var(--mute)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.badge{padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;color:#fff}
.b-High,.b-p1{background:var(--high)}.b-Medium,.b-p2{background:var(--med)}.b-Low,.b-p3,.b-p4{background:var(--low)}
.b-p2{background:#f97316}.b-p3{background:#eab308}
.alert{background:rgba(225,29,72,.1);border:1px solid rgba(225,29,72,.4);color:var(--high);padding:10px 14px;border-radius:12px;font-weight:700;margin-bottom:14px}
.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45);color:#b45309;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
:root[data-theme="dark"] .warn{color:#fbbf24}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.item{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.item .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.item .v{font-size:18px;font-weight:700;margin-top:3px}
.item small{color:var(--mute)}
h3{margin:22px 0 10px;font-size:15px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:13px;margin:3px 4px 3px 0}
.tag.kw{background:rgba(79,70,229,.12);color:var(--brand);font-weight:600}
.prob{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.prob .t{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.prob .f{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.prob.top{font-weight:700}
.action{border-left:4px solid var(--brand);background:var(--bg2);padding:12px 14px;border-radius:0 12px 12px 0}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg2);color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
tr:hover td{background:rgba(79,70,229,.05)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--bg2),var(--line),var(--bg2));background-size:200% 100%;animation:sh 1.1s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.empty{text-align:center;color:var(--mute);padding:30px}
@media(max-width:700px){.res-top{grid-template-columns:1fr}.prob{grid-template-columns:110px 1fr 46px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>🛠️</i><div><h1>CivicFix AI <span class="pill">v4</span></h1><div class="sub">Smart campus complaint triage · category · severity · priority</div></div></div>
    <div class="row"><span class="pill" id="health">● connecting…</span><button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">🌙</button></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-t="single">🔎 Analyze</button>
    <button class="tab" data-t="batch">📋 Batch triage</button>
    <button class="tab" data-t="hist">🕘 History <span id="hcount" class="count"></span></button>
  </nav>

  <!-- SINGLE -->
  <section id="single">
    <div class="card">
      <textarea id="complaint" maxlength="600" placeholder="Describe the problem… e.g. Electrical switch is sparking near students"></textarea>
      <div class="bar">
        <div class="row"><button class="btn" id="go">Analyze complaint</button><button class="btn ghost" id="mic" title="Speak your complaint">🎤 Speak</button><button class="btn ghost" id="clear">Clear</button></div>
        <span class="count"><span id="cc">0</span>/600 · Ctrl+Enter</span>
      </div>
      <div class="chips" id="examples"></div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div id="result" class="hide"></div>
  </section>

  <!-- BATCH -->
  <section id="batch" class="hide">
    <div class="card">
      <p style="margin-top:0">Paste one complaint per line (or upload a <b>.csv / .txt</b>). Everything is ranked by priority automatically.</p>
      <textarea id="bulk" placeholder="Water pipe burst near hostel&#10;Fan not working in class 3B&#10;Garbage piled near canteen"></textarea>
      <div class="bar">
        <div class="row"><button class="btn" id="bgo">Rank complaints</button>
          <label class="btn ghost" style="cursor:pointer">📁 Upload file<input type="file" id="file" accept=".csv,.txt" hidden></label>
          <button class="btn ghost" id="bsample">Load sample</button></div>
        <span class="count">max 200 per run</span>
      </div>
      <div class="status" id="bstatus"></div>
    </div>
    <div id="bresult"></div>
  </section>

  <!-- HISTORY -->
  <section id="hist" class="hide">
    <div class="card">
      <div class="bar" style="margin:0 0 12px"><b>Recent analyses (saved in this browser)</b><div class="row"><button class="btn ghost" id="hexp">⬇ Export CSV</button><button class="btn ghost" id="hclr">Clear</button></div></div>
      <div id="hlist"></div>
    </div>
  </section>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EX=["Electrical switch is sparking near students","Water pipe burst and flooding the hostel corridor","Big pothole near main gate, a bike fell","Small crack on classroom wall","Overflowing dustbin smells bad near canteen","Projector remote is not working","Washroom drain is blocked in the lab block"];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const sevColor=s=>s==="High"?"var(--high)":s==="Medium"?"var(--med)":"var(--low)";
const pClass=p=>"b-"+p.slice(0,2).toLowerCase();

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;$("#theme").textContent=t==="dark"?"☀️":"🌙";store.set("cf-theme",t)}
setTheme(store.get("cf-theme",matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* tabs */
$$(".tab").forEach(b=>b.onclick=()=>{$$(".tab").forEach(x=>x.classList.toggle("on",x===b));["single","batch","hist"].forEach(id=>$("#"+id).classList.toggle("hide",id!==b.dataset.t));if(b.dataset.t==="hist")renderHist()});

/* api helper with timeout + one retry (handles serverless cold start) */
async function api(path,body,tries=2){
  for(let i=0;i<tries;i++){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
    try{
      const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,signal:ctl.signal});
      const d=await r.json().catch(()=>({error:"Bad server response"}));
      if(!r.ok)throw Error(d.error||"Request failed ("+r.status+")");
      return d;
    }catch(e){if(i===tries-1)throw(e.name==="AbortError"?Error("Server timed out. Please retry."):e);await new Promise(r=>setTimeout(r,600))}
    finally{clearTimeout(to)}
  }
}
api("/api").then(d=>{$("#health").textContent="● online · "+d.trained_on+" samples";$("#health").style.color="var(--low)"}).catch(()=>{$("#health").textContent="● offline";$("#health").style.color="var(--high)"});

/* examples + input */
$("#examples").innerHTML=EX.map(e=>`<button class="chip">${esc(e)}</button>`).join("");
$("#examples").onclick=e=>{if(e.target.classList.contains("chip")){$("#complaint").value=e.target.textContent;$("#cc").textContent=$("#complaint").value.length;analyze()}};
$("#complaint").oninput=e=>$("#cc").textContent=e.target.value.length;
$("#complaint").onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))analyze()};
$("#go").onclick=analyze;
$("#clear").onclick=()=>{$("#complaint").value="";$("#cc").textContent=0;$("#result").classList.add("hide");$("#status").textContent=""};

/* voice input */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$("#mic").classList.add("hide");else $("#mic").onclick=()=>{const r=new SR();r.lang="en-IN";r.onstart=()=>$("#mic").textContent="🎙️ Listening…";r.onend=()=>$("#mic").textContent="🎤 Speak";r.onresult=e=>{$("#complaint").value=e.results[0][0].transcript;$("#cc").textContent=$("#complaint").value.length;analyze()};r.start()};

/* gauge */
function gauge(score,color){
  const R=76,C=2*Math.PI*R;
  return `<div class="gauge"><svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/>
  <circle id="arc" cx="90" cy="90" r="${R}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>
  <div class="mid"><div class="num">${Math.round(score)}</div><div class="lbl">priority / 100</div></div></div>`;
}

/* single analysis */
async function analyze(){
  const c=$("#complaint").value.trim();
  if(c.length<3){$("#status").innerHTML='<span class="err">Please describe the problem (min 3 characters).</span>';return}
  $("#go").disabled=true;$("#status").textContent="Analyzing…";
  $("#result").className="card";$("#result").innerHTML='<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div>';
  try{
    const d=await api("/api",{complaint:c});
    render(d);saveHist(d);$("#status").textContent=`Done in ${d.ms} ms`;
  }catch(e){$("#result").classList.add("hide");$("#status").innerHTML='<span class="err">⚠ '+esc(e.message)+'</span>'}
  finally{$("#go").disabled=false}
}
function render(d){
  const col=sevColor(d.severity),top=Math.max(...Object.values(d.category_probabilities));
  const probs=Object.entries(d.category_probabilities).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="prob ${v===top?"top":""}"><span>${esc(k)}</span><div class="t"><div class="f" data-w="${v}"></div></div><span>${v}%</span></div>`).join("");
  $("#result").className="card fade";
  $("#result").innerHTML=`
  ${d.escalate?'<div class="alert">🚨 Escalate now — safety-critical issue. '+esc(d.sla)+'.</div>':""}
  ${d.needs_review?'<div class="warn">🤔 The model is unsure about the category. Please verify. Other possibilities: '+d.alternatives.map(a=>esc(a.category)+" ("+a.confidence+"%)").join(", ")+'</div>':""}
  <div class="res-top">${gauge(d.priority_score,col)}
    <div><div class="badges"><span class="badge ${pClass(d.priority)}">${esc(d.priority)}</span><span class="badge b-${esc(d.severity)}">Severity: ${esc(d.severity)}</span><span class="badge" style="background:var(--brand)">${esc(d.category)}</span></div>
    <div style="color:var(--mute);font-size:14px">“${esc(d.complaint)}”</div>
    <div class="action" style="margin-top:12px"><b>Suggested action:</b> ${esc(d.suggested_action)}</div></div></div>
  <div class="grid">
    <div class="item"><div class="k">Category</div><div class="v">${esc(d.category)}</div><small>${d.category_confidence}% · ${esc(d.category_method)}</small></div>
    <div class="item"><div class="k">Severity</div><div class="v" style="color:${col}">${esc(d.severity)}</div><small>ML ${d.severity_confidence}% · hybrid ${d.hybrid_severity_score}</small></div>
    <div class="item"><div class="k">Department</div><div class="v">${esc(d.department)}</div></div>
    <div class="item"><div class="k">Response time (SLA)</div><div class="v">${esc(d.sla)}</div></div></div>
  <h3>Why this result?</h3><div>${d.severity_reasons.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
  ${d.key_terms.length?'<div style="margin-top:6px"><small class="count">Words that drove the category:</small><br>'+d.key_terms.map(x=>`<span class="tag kw">${esc(x)}</span>`).join("")+'</div>':""}
  <h3>Category probabilities</h3>${probs}
  <div class="row" style="margin-top:16px"><button class="btn ghost" id="copy">📋 Copy JSON</button></div>`;
  requestAnimationFrame(()=>{const R=76,C=2*Math.PI*R;const a=$("#arc");if(a)a.style.strokeDashoffset=C*(1-d.priority_score/100);$$(".prob .f").forEach(f=>f.style.width=f.dataset.w+"%")});
  $("#copy").onclick=()=>{navigator.clipboard.writeText(JSON.stringify(d,null,2));$("#copy").textContent="✅ Copied"};
}

/* history */
function saveHist(d){const h=store.get("cf-hist",[]);h.unshift({t:Date.now(),c:d.complaint,cat:d.category,sev:d.severity,pri:d.priority,ps:d.priority_score,dep:d.department});store.set("cf-hist",h.slice(0,50));updCount()}
function updCount(){const n=store.get("cf-hist",[]).length;$("#hcount").textContent=n?"("+n+")":""}
function renderHist(){
  const h=store.get("cf-hist",[]);
  $("#hlist").innerHTML=h.length?`<div class="tw"><table><thead><tr><th>When</th><th>Complaint</th><th>Category</th><th>Severity</th><th>Priority</th></tr></thead><tbody>${h.map(x=>`<tr><td>${new Date(x.t).toLocaleString()}</td><td>${esc(x.c)}</td><td>${esc(x.cat)}</td><td><span class="badge b-${esc(x.sev)}">${esc(x.sev)}</span></td><td>${esc(x.pri)} · ${x.ps}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No analyses yet.</div>';
}
$("#hclr").onclick=()=>{store.set("cf-hist",[]);updCount();renderHist()};
$("#hexp").onclick=()=>csv(store.get("cf-hist",[]).map(x=>({time:new Date(x.t).toISOString(),complaint:x.c,category:x.cat,severity:x.sev,priority:x.pri,score:x.ps,department:x.dep})),"civicfix-history.csv");
updCount();

/* csv export (with formula-injection guard) */
function csv(rows,name){
  if(!rows.length)return;const k=Object.keys(rows[0]);
  const cell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const blob=new Blob([[k.join(",")].concat(rows.map(r=>k.map(h=>cell(r[h])).join(","))).join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* batch */
$("#bsample").onclick=()=>$("#bulk").value=EX.join("\n")+"\nFan making noise in room 204\nStray dogs near the hostel gate";
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const t=await f.text();
  let lines=t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(f.name.endsWith(".csv")){ // use first column, skip header if it looks like one
    lines=lines.map(l=>l.startsWith('"')?l.slice(1).split('"')[0]:l.split(",")[0]);
    if(/^(complaint|text|description)/i.test(lines[0]))lines.shift();
  }
  $("#bulk").value=lines.slice(0,200).join("\n");
};
$("#bgo").onclick=async()=>{
  const list=$("#bulk").value.split("\n").map(s=>s.trim()).filter(s=>s.length>2);
  if(!list.length){$("#bstatus").innerHTML='<span class="err">Add at least one complaint.</span>';return}
  $("#bgo").disabled=true;$("#bstatus").textContent=`Ranking ${Math.min(list.length,200)} complaints…`;
  try{
    const d=await api("/api/batch",{complaints:list});
    $("#bstatus").textContent=`Ranked ${d.count} complaints in ${d.ms} ms`;
    const R=d.results,cnt=k=>R.filter(r=>r.priority.startsWith(k)).length;
    $("#bresult").innerHTML=`<div class="card fade"><div class="stats">
      <div class="stat"><b>${R.length}</b>Total</div><div class="stat"><b style="color:var(--high)">${cnt("P1")}</b>P1 Critical</div>
      <div class="stat"><b style="color:#f97316">${cnt("P2")}</b>P2 High</div><div class="stat"><b>${cnt("P3")}</b>P3 Medium</div><div class="stat"><b style="color:var(--low)">${cnt("P4")}</b>P4 Low</div>
      <div class="stat"><b>${R.filter(r=>r.needs_review).length}</b>Need review</div></div>
      <div class="tw"><table><thead><tr><th>#</th><th>Complaint</th><th>Category</th><th>Severity</th><th>Priority</th><th>Department</th></tr></thead><tbody>
      ${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.complaint)}${r.needs_review?' <span class="tag">⚠ review</span>':""}</td><td>${esc(r.category)}<br><small class="count">${r.category_confidence}%</small></td><td><span class="badge b-${esc(r.severity)}">${esc(r.severity)}</span></td><td><span class="badge ${pClass(r.priority)}">${esc(r.priority)}</span><br><small class="count">${r.priority_score}/100</small></td><td>${esc(r.department)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="bexp">⬇ Export ranked CSV</button></div></div>`;
    $("#bexp").onclick=()=>csv(R.map((r,i)=>({rank:i+1,complaint:r.complaint,category:r.category,category_confidence:r.category_confidence,severity:r.severity,priority:r.priority,priority_score:r.priority_score,sla:r.sla,department:r.department,suggested_action:r.suggested_action})),"civicfix-ranked.csv");
  }catch(e){$("#bstatus").innerHTML='<span class="err">⚠ '+esc(e.message)+'</span>'}
  finally{$("#bgo").disabled=false}
};
</script>
</body>
</html>
